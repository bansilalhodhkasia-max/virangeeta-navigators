<!doctype html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>
Scholar Path Russia | Study in Russia | Virangeeta Navigators
</title>

<meta
  name="description"
  content="Scholar Path Russia by Virangeeta Navigators helps students explore Russian universities, compare programmes, estimate study costs, understand scholarships and make informed decisions."
>

<meta
  name="author"
  content="Virangeeta Navigators"
>

<meta
  name="robots"
  content="index,follow,max-image-preview:large"
>

<link
  rel="icon"
  type="image/jpeg"
  href="logo.jpg"
>

<meta
  property="og:title"
  content="Scholar Path Russia | Virangeeta Navigators"
>

<meta
  property="og:description"
  content="Study • Compare • Decide — source-first university information for students."
>

<meta
  property="og:image"
  content="logo.jpg"
>

<meta
  name="theme-color"
  content="#07111f"
>

<style>

/* =========================================================
   SCHOLAR PATH RUSSIA
   COMPLETE WEBSITE SYSTEM
========================================================= */

:root{
  --navy:#07111f;
  --navy2:#0d1b2e;
  --teal:#117f76;
  --teal2:#0a655e;
  --mint:#eaf7f4;
  --paper:#f6f8fb;
  --white:#ffffff;
  --text:#102033;
  --muted:#68788b;
  --line:#dce4eb;
  --gold:#c99a3d;
  --danger:#a43a3a;
  --shadow:0 15px 50px rgba(7,17,31,.09);
  --radius:20px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:
    Inter,
    Arial,
    Helvetica,
    sans-serif;
  color:var(--text);
  background:#fff;
  line-height:1.6;
}

body.modal-open{
  overflow:hidden;
}

img{
  max-width:100%;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.container{
  width:min(1200px,calc(100% - 30px));
  margin:auto;
}

/* =========================================================
   HEADER
========================================================= */

.header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}

.nav{
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  font-weight:900;
  white-space:nowrap;
}

.brand img{
  width:46px;
  height:46px;
  object-fit:contain;
  border-radius:12px;
}

.brand small{
  display:block;
  color:var(--muted);
  font-size:8px;
  letter-spacing:1.8px;
  margin-top:1px;
}

.navlinks{
  display:flex;
  align-items:center;
  gap:16px;
  font-size:12px;
  font-weight:800;
}

.navlinks a:hover{
  color:var(--teal);
}

.mobile-menu{
  display:none;
  border:1px solid var(--line);
  background:#fff;
  width:42px;
  height:42px;
  border-radius:11px;
  font-size:20px;
}

.mobile-nav{
  display:none;
  padding:12px 0 18px;
  border-top:1px solid var(--line);
}

.mobile-nav.open{
  display:block;
}

.mobile-nav a{
  display:block;
  padding:10px 0;
  font-size:13px;
  font-weight:800;
}

/* =========================================================
   BUTTONS
========================================================= */

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  border:1px solid var(--teal);
  background:var(--teal);
  color:#fff;
  border-radius:11px;
  padding:11px 16px;
  font-weight:800;
  cursor:pointer;
  transition:.2s ease;
}

.btn:hover{
  transform:translateY(-1px);
  background:var(--teal2);
}

.btn.secondary{
  background:#fff;
  color:var(--text);
  border-color:var(--line);
}

.btn.dark{
  background:var(--navy);
  border-color:var(--navy);
}

.btn.gold{
  background:var(--gold);
  border-color:var(--gold);
}

.btn.small{
  padding:8px 11px;
  font-size:11px;
}

/* =========================================================
   HERO
========================================================= */

.hero{
  background:
    radial-gradient(
      circle at 85% 20%,
      rgba(17,127,118,.12),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #f7fbff,
      #eef8f6
    );
  padding:78px 0 70px;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:50px;
  align-items:center;
}

.eyebrow{
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  font-weight:900;
  color:var(--teal);
}

h1{
  font-size:
    clamp(44px,6vw,78px);
  line-height:.97;
  letter-spacing:-4px;
  margin:16px 0;
}

h1 span{
  color:var(--teal);
}

.lead{
  font-size:18px;
  color:var(--muted);
  max-width:720px;
}

.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:24px;
}

.trust{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:22px;
}

.pill,
.badge{
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  background:#fff;
  border:1px solid var(--line);
  padding:6px 10px;
  font-size:10px;
  font-weight:800;
}

.green{
  background:#e3f5ef;
  color:#087367;
  border:0;
}

.hero-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:28px;
  padding:28px;
  box-shadow:var(--shadow);
}

.hero-logo{
  width:125px;
  height:125px;
  object-fit:contain;
  display:block;
  margin:0 auto 20px;
}

.hero-card h2{
  text-align:center;
  margin:0 0 8px;
}

.hero-card p{
  text-align:center;
  color:var(--muted);
}

/* =========================================================
   GENERAL
========================================================= */

section{
  padding:70px 0;
}

.paper{
  background:var(--paper);
}

.head{
  margin-bottom:28px;
}

.head h2{
  font-size:
    clamp(30px,4vw,44px);
  line-height:1.05;
  margin:8px 0;
  letter-spacing:-1.5px;
}

.head p{
  color:var(--muted);
  max-width:850px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.grid4{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.panel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:22px;
  box-shadow:var(--shadow);
}

.mini{
  font-size:12px;
  color:var(--muted);
}

.big{
  font-size:34px;
  font-weight:900;
  color:var(--teal);
}

/* =========================================================
   UNIVERSITY EXPLORER
========================================================= */

.filters{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:10px;
  background:#fff;
  border:1px solid var(--line);
  padding:17px;
  border-radius:20px;
  box-shadow:var(--shadow);
}

.search{
  margin-top:10px;
}

label{
  display:block;
  font-size:10px;
  font-weight:900;
  margin-bottom:5px;
  letter-spacing:.3px;
}

input,
select,
textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:11px;
  padding:12px;
  background:#fff;
  color:var(--text);
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--teal);
  box-shadow:
    0 0 0 3px
    rgba(17,127,118,.08);
}

.explorer-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-top:18px;
}

.featured-label{
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  color:var(--teal);
}

.cards{
  display:grid;
  grid-template-columns:
    repeat(2,1fr);
  gap:18px;
  margin-top:17px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px;
  box-shadow:
    0 7px 30px
    rgba(7,17,31,.05);
  transition:.2s ease;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow);
}

.card-image{
  width:100%;
  height:180px;
  border-radius:15px;
  object-fit:cover;
  background:var(--mint);
  margin-bottom:15px;
}

.card-logo{
  width:55px;
  height:55px;
  border-radius:13px;
  object-fit:contain;
  border:1px solid var(--line);
  background:#fff;
}

.card-top{
  display:flex;
  gap:13px;
  align-items:center;
}

.card h3{
  margin:8px 0 3px;
  line-height:1.2;
}

.loc{
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}

.badges{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.ibox{
  background:var(--paper);
  border-radius:11px;
  padding:11px;
}

.ibox small{
  display:block;
  color:#728094;
  font-size:9px;
  text-transform:uppercase;
  font-weight:900;
}

.ibox strong{
  display:block;
  margin-top:3px;
  font-size:12px;
}

.note{
  margin-top:13px;
  padding-top:13px;
  border-top:1px solid var(--line);
  font-size:12px;
  color:var(--muted);
}

.card-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:15px;
}

.card-actions .btn{
  font-size:11px;
}

.hidden-university{
  display:none;
}

.show-all .hidden-university{
  display:block;
}

#showMoreUniversities{
  display:block;
  margin:25px auto 0;
}

/* =========================================================
   MATCH
========================================================= */

.match{
  background:var(--navy);
  color:#fff;
  border-radius:26px;
  padding:26px;
}

.match-grid{
  display:grid;
  grid-template-columns:
    repeat(3,1fr);
  gap:11px;
}

.match input,
.match select{
  background:#12243b;
  color:#fff;
  border-color:#2b4058;
}

.score{
  font-size:60px;
  font-weight:900;
  color:#70d6cb;
  line-height:1;
}

.result-list{
  display:grid;
  gap:10px;
  margin-top:17px;
}

.result{
  background:#12243b;
  border:1px solid #263d57;
  padding:14px;
  border-radius:13px;
}

/* =========================================================
   MAP
========================================================= */

.map{
  position:relative;
  min-height:530px;
  border-radius:25px;
  background:
    linear-gradient(
      145deg,
      #eef4f8,
      #e5f3ef
    );
  overflow:hidden;
  border:1px solid var(--line);
}

.map:before{
  content:"RUSSIA";
  position:absolute;
  inset:45% 0 auto;
  text-align:center;
  font-size:72px;
  font-weight:900;
  letter-spacing:15px;
  color:
    rgba(17,127,118,.08);
}

.pin{
  position:absolute;
  width:14px;
  height:14px;
  border-radius:50%;
  background:var(--teal);
  border:3px solid #fff;
  box-shadow:
    0 4px 14px
    rgba(0,0,0,.2);
  cursor:pointer;
}

.pin span{
  display:none;
  position:absolute;
  left:17px;
  top:-9px;
  white-space:nowrap;
  background:var(--navy);
  color:#fff;
  padding:5px 8px;
  border-radius:7px;
  font-size:10px;
}

.pin:hover span{
  display:block;
}

/* =========================================================
   COMPARISON
========================================================= */

.compare-table{
  overflow:auto;
}

.compare-table table{
  border-collapse:collapse;
  min-width:750px;
  width:100%;
}

.compare-table th,
.compare-table td{
  padding:11px;
  border-bottom:1px solid var(--line);
  text-align:left;
}

.compare-table th{
  background:var(--paper);
}

/* =========================================================
   CALCULATOR
========================================================= */

.calc{
  background:var(--navy);
  color:#fff;
  border-radius:25px;
  padding:25px;
}

.calc input{
  background:#12243b;
  color:#fff;
  border-color:#2b4058;
}

.total{
  margin-top:18px;
  background:#12243b;
  padding:18px;
  border-radius:14px;
}

.total strong{
  display:block;
  font-size:38px;
  margin-top:4px;
}

/* =========================================================
   GUIDES
========================================================= */

.article{
  min-height:190px;
}

.article h3{
  margin:8px 0;
}

.article a{
  color:var(--teal);
  font-weight:900;
}

/* =========================================================
   TRACKER
========================================================= */

.tracker{
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:22px;
}

.status-grid{
  display:grid;
  grid-template-columns:
    repeat(6,1fr);
  gap:8px;
  margin-top:18px;
}

.status{
  padding:12px 8px;
  border-radius:11px;
  background:#f1f4f7;
  text-align:center;
  font-size:10px;
  font-weight:900;
  border:0;
}

.status.done{
  background:#dff3ee;
  color:#087367;
}

.status.current{
  background:#d9e8ff;
  color:#1b4f9a;
}

/* =========================================================
   GALLERY
========================================================= */

.gallery{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:12px;
}

.gallery-item{
  position:relative;
  overflow:hidden;
  border-radius:16px;
  background:var(--mint);
  min-height:180px;
}

.gallery-item:first-child{
  grid-column:span 2;
  grid-row:span 2;
}

.gallery-item img{
  width:100%;
  height:100%;
  min-height:180px;
  object-fit:cover;
  display:block;
  transition:.35s ease;
}

.gallery-item:hover img{
  transform:scale(1.05);
}

.gallery-caption{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:25px 13px 12px;
  color:#fff;
  font-weight:800;
  font-size:12px;
  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.7)
    );
}

/* =========================================================
   TESTIMONIALS
========================================================= */

.testimonial{
  position:relative;
}

.quote{
  font-size:30px;
  color:var(--teal);
  font-weight:900;
}

.testimonial p{
  color:var(--muted);
}

.student{
  display:flex;
  align-items:center;
  gap:11px;
  margin-top:15px;
}

.student-avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  background:var(--mint);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  color:var(--teal);
}

/* =========================================================
   FAQ
========================================================= */

.faq{
  display:grid;
  gap:10px;
}

.faq-item{
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  overflow:hidden;
}

.faq-question{
  width:100%;
  text-align:left;
  border:0;
  background:#fff;
  padding:17px;
  font-weight:900;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.faq-answer{
  display:none;
  padding:0 17px 17px;
  color:var(--muted);
  font-size:13px;
}

.faq-item.open .faq-answer{
  display:block;
}

/* =========================================================
   AI ASSISTANT
========================================================= */

.ai-section{
  background:
    radial-gradient(
      circle at 80% 20%,
      rgba(17,127,118,.22),
      transparent 35%
    ),
    var(--navy);
  color:#fff;
}

.ai-box{
  background:#0d1b2e;
  border:1px solid #263d57;
  border-radius:25px;
  padding:24px;
}

.ai-box input,
.ai-box select,
.ai-box textarea{
  background:#12243b;
  color:#fff;
  border-color:#2b4058;
}

.ai-result{
  margin-top:18px;
  padding:18px;
  border-radius:15px;
  background:#12243b;
  border:1px solid #263d57;
  min-height:70px;
}

.ai-result strong{
  color:#70d6cb;
}

.ai-questions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:12px;
}

.ai-question-btn{
  border:1px solid #39536e;
  background:#10243a;
  color:#fff;
  border-radius:999px;
  padding:7px 11px;
  font-size:10px;
  cursor:pointer;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;
  inset:0;
  background:
    rgba(3,10,18,.72);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:3000;
}

.modal.show{
  display:flex;
}

.modalbox{
  width:min(920px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:24px;
  padding:25px;
}

.close{
  float:right;
  border:0;
  background:#eef2f6;
  border-radius:10px;
  width:38px;
  height:38px;
  font-size:20px;
}

.modal-logo{
  width:75px;
  height:75px;
  object-fit:contain;
  border-radius:15px;
  border:1px solid var(--line);
}

.modal-head{
  display:flex;
  gap:16px;
  align-items:center;
  margin-bottom:20px;
}

/* =========================================================
   WHATSAPP
========================================================= */

.whatsapp-float{
  position:fixed;
  right:20px;
  bottom:22px;
  z-index:2500;
  width:58px;
  height:58px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#25d366;
  color:#fff;
  font-size:28px;
  box-shadow:
    0 8px 28px
    rgba(0,0,0,.22);
}

.whatsapp-float:hover{
  transform:scale(1.06);
}

/* =========================================================
   FOOTER
========================================================= */

footer{
  background:var(--navy);
  color:#d8e1e9;
  padding:50px 0;
}

.footer{
  display:grid;
  grid-template-columns:
    2fr 1fr 1fr;
  gap:25px;
}

.footer a{
  display:block;
  color:#c8d4df;
  margin:7px 0;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:950px){

  .navlinks{
    display:none;
  }

  .mobile-menu{
    display:block;
  }

  .hero-grid,
  .grid2{
    grid-template-columns:1fr;
  }

  .filters{
    grid-template-columns:1fr 1fr;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .grid3,
  .grid4{
    grid-template-columns:1fr 1fr;
  }

  .match-grid{
    grid-template-columns:1fr 1fr;
  }

  .status-grid{
    grid-template-columns:
      repeat(3,1fr);
  }

  .gallery{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:600px){

  .container{
    width:calc(100% - 20px);
  }

  section{
    padding:55px 0;
  }

  h1{
    font-size:48px;
    letter-spacing:-2.5px;
  }

  .filters,
  .match-grid,
  .grid3,
  .grid4{
    grid-template-columns:1fr;
  }

  .info{
    grid-template-columns:1fr;
  }

  .status-grid{
    grid-template-columns:1fr 1fr;
  }

  .gallery{
    grid-template-columns:1fr 1fr;
  }

  .gallery-item:first-child{
    grid-column:span 2;
  }

  .hero{
    padding:55px 0;
  }

  .brand span{
    font-size:13px;
  }

  .header .btn{
    display:none;
  }

  .footer{
    grid-template-columns:1fr;
  }

}

/* =========================================================
   LOADING
========================================================= */

.loading{
  padding:30px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--line);
  border-radius:18px;
  background:#fff;
}

/* =========================================================
   HIGHLIGHT
========================================================= */

.highlight-box{
  background:
    linear-gradient(
      135deg,
      var(--mint),
      #fff
    );
  border:1px solid #d7eae5;
  border-radius:22px;
  padding:23px;
}

/* =========================================================
   SOURCE NOTICE
========================================================= */

.source-notice{
  background:#f4f8f7;
  border-left:4px solid var(--teal);
  padding:14px 16px;
  border-radius:10px;
  color:#50616f;
  font-size:12px;
  margin-top:20px;
}
